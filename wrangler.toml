# Cloudflare Workers configuration for Facebook Supermarket Monitor
# Runs every 5 minutes via Cron Trigger, monitors Egyptian supermarket
# Facebook pages via the Google Alerts Atom feed (free, keyless), shares
# to a Facebook Page via Meta Graph API, stores state in D1, and serves
# an admin dashboard.

name = "facebook-supermarket-monitor"
main = "src/index.ts"
compatibility_date = "2026-10-31"

# Enable Node.js compatibility for broader API surface
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "facebook-monitor-db"
# database_id is populated automatically after running `wrangler d1 create`
# and applying the migration. Copy the output ID here.
database_id = "52a28e2d-77e9-4537-a88a-9c430159d3b3"

# Cron Trigger: every 10 minutes (sub-second precision trigger for GitHub Actions radar)
[triggers]
crons = ["*/10 * * * *"]

[vars]
# No runtime config vars needed; all secrets are set via `wrangler secret put`
# Required Worker secrets:
#   - FB_PAGE_ID: Your Facebook Page ID
#   - FB_PAGE_ACCESS_TOKEN: Permanent Meta Graph Page Access Token
#   - DASHBOARD_AUTH_KEY: Admin API key
#   - GITHUB_TOKEN: GitHub PAT with repo/workflow scope to trigger GitHub Actions
#   - LARAVEL_INGEST_URL: Target Laravel ingestion endpoint (e.g. https://your-domain.com/api/v1/facebook/ingest)
#   - LARAVEL_INGEST_SECRET: Shared secret matching Laravel's INGEST_WEBHOOK_SECRET (sent via X-Ingest-Secret)

[observability]
enabled = true



